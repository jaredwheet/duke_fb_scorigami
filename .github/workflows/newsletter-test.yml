name: Newsletter Test

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to preview'
        required: true
        default: 'sunday'
        type: choice
        options:
          - sunday
          - watercooler
          - bulletin
      test_date:
        description: 'Issue date to display (YYYY-MM-DD)'
        required: false
        type: string

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Send test newsletter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_TEST_TO: ${{ secrets.NEWSLETTER_TEST_TO }}
          NEWSLETTER_TEST_EDITION: ${{ inputs.edition || 'sunday' }}
          NEWSLETTER_TEST_DATE: ${{ inputs.test_date || '' }}
          CFB_DATA_KEY: ${{ secrets.CFB_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EDITORIAL_MODEL: ${{ secrets.OPENAI_EDITORIAL_MODEL || 'gpt-4o-mini' }}
          NEWSLETTER_USE_LIVE_DATA: 'true'
          RESEND_FROM_EMAIL: Duke Football Scorigami <onboarding@resend.dev>
        run: npm run newsletter:test
