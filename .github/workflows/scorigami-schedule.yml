name: Duke FB Scorigami Scheduled Run

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      fake_date:
        description: 'Reference date (YYYY-MM-DD) for a deterministic manual run'
        required: false
        type: string
      backfill_days:
        description: 'How many days of completed games to recover'
        required: false
        default: '30'
        type: string

concurrency:
  group: duke-fb-scorigami
  cancel-in-progress: false

jobs:
  run-scorigami:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run main script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CFB_DATA_KEY: ${{ secrets.CFB_DATA_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAKE_DATE: ${{ inputs.fake_date || '' }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '30' }}
        run: node src/index.js
